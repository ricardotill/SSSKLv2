version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /Frontend
    schedule:
      interval: weekly
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
      vitest:
        # vitest and its plugins must move in lockstep or npm ci fails with ERESOLVE.
        patterns: ["vitest", "@vitest/*"]
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript is pinned by the @angular/build peer range; bump it together with Angular.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  # Base images of Backend/Dockerfile and Frontend/Dockerfile
  - package-ecosystem: docker
    directories: ["/Backend", "/Frontend"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
  # Images in docker-compose.yml and docker-compose.external.yml
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
