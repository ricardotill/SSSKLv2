name: Mobile CI

# The mobile app is still in development, so this workflow doesn't run on pushes or pull requests yet:
# start it by hand (Actions → Mobile CI → Run workflow). To turn it on, restore the triggers:
#   push: { branches: [ "master" ], paths: [ "Mobile/**", "Directory.Packages.props", "Directory.Build.props", ".github/workflows/mobile.yml" ] }
#   pull_request: { types: [opened, synchronize, reopened], paths: (same) }
on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '11.0.x'

jobs:
  test-android:
    name: Test & build Android
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Test (Core, no workload needed)
      run: dotnet test Mobile/SSSKL.Mobile.Test --verbosity normal

    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: 17
        distribution: 'microsoft'

    - name: Install MAUI Android workload
      run: dotnet workload install maui-android

    - name: Build Android
      # Restore evaluates every target framework; limit it to the one this runner has the workload for.
      run: dotnet build Mobile/SSSKL.Mobile -f net11.0-android -p:SssklTargetFrameworks=net11.0-android -c Release

  build-ios:
    name: Build iOS (simulator, unsigned)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Select Xcode
      # .NET for iOS needs the Xcode it was built against (27.x); the runner's default can be older.
      run: |
        xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
        if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
        xcodebuild -version

    - name: Install MAUI iOS workload
      run: dotnet workload install maui-ios

    - name: Build iOS
      # Restore evaluates every target framework; limit it to the one this runner has the workload for.
      run: dotnet build Mobile/SSSKL.Mobile -f net11.0-ios -p:SssklTargetFrameworks=net11.0-ios -c Release -p:RuntimeIdentifier=iossimulator-arm64
