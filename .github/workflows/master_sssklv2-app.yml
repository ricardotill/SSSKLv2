# Deploys the API to Azure App Service (sssklv2-app) for a release: a tag vX.Y.Z on master
# (git tag v1.4.0 && git push origin v1.4.0). The version comes from the tag (.github/workflows/version.yml);
# a pre-release tag (v1.4.0-rc.1) or a tag that is not on master deploys nothing.
# To redeploy a release by hand: Actions → this workflow → Run workflow, and pick the tag (not a branch).
# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy

name: Build and deploy ASP.Net Core app to Azure Web App - sssklv2-app

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

# One deploy at a time; a newer release waits instead of cancelling one that is running
concurrency:
  group: deploy-sssklv2-app
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Version
    uses: ./.github/workflows/version.yml

  build:
    needs: version
    if: needs.version.outputs.stable == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Decode and save SixLabors license
        run: |
          if [ -z "${{ secrets.SixLaborsLicense }}" ]; then
            echo "SixLaborsLicense secret is missing or empty"
            exit 1
          fi
          echo "${{ secrets.SixLaborsLicense }}" | base64 -d > ./sixlabors.lic
          cp ./sixlabors.lic ../sixlabors.lic

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -p:Version=${{ needs.version.outputs.version }}

      - name: Test
        run: dotnet test --no-build --verbosity normal

      - name: Publish
        env:
          # Uploads debug symbols to Sentry (ssskl-api) during the Release publish; see Backend/SSSKL.Web/SSSKL.Web.csproj.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          [ -n "$SENTRY_AUTH_TOKEN" ] && echo "SENTRY_AUTH_TOKEN=set" || echo "::warning::SENTRY_AUTH_TOKEN not set; no Sentry symbol upload"
          dotnet publish Backend/SSSKL.Web/SSSKL.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp --no-restore -p:Version="$APP_VERSION"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    # The Azure login federates on this environment (subject repo:ricardotill/SSSKLv2:environment:production),
    # since a tag run has a different ref for every release. See docs/docker.md, "Releases".
    environment: production
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_9FF75231646C4B1695B25E9C7BB183C0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5C5CD7DA74434C6B8A323C5E4759198B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5E33CED8F77E4A82B340892973A038D8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'sssklv2-app'
          slot-name: 'Production'
          package: .
          clean: true
