# Builds and tests the backend on every push to master, version tag and pull request. On master and on version
# tags it then pushes the API's Docker image (linux/amd64 and linux/arm64) to ghcr.io/ricardotill/ssskl-api;
# a pull request only checks that the image builds. See docs/docker.md.
#
# Image tags pushed:
#   master, sha-<short hash>      every push to master
#   1.4.0, 1.4, latest            a tag v1.4.0 (on master); a server that follows `latest` only gets releases
name: Backend CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_VERSION: '11.0.x'                 # set this to the .NET Core version to use
  # The registry wants a lower-case name
  IMAGE: ghcr.io/ricardotill/ssskl-api

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Decode and save SixLabors license
      run: |
        if [ -z "${{ secrets.SixLaborsLicense }}" ]; then
          echo "SixLaborsLicense secret is missing or empty"
          exit 1
        fi
        echo "${{ secrets.SixLaborsLicense }}" | base64 -d > ./sixlabors.lic
        cp ./sixlabors.lic ../sixlabors.lic

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

  scan:
    name: SonarCloud Analyze
    needs: build
    # Dependabot PRs get no SONAR_TOKEN; the build job still verifies them. Tags are the master commit, already analyzed.
    if: github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Decode and save SixLabors license
        run: |
          if [ -z "${{ secrets.SixLaborsLicense }}" ]; then
            echo "SixLaborsLicense secret is missing or empty"
            exit 1
          fi
          echo "${{ secrets.SixLaborsLicense }}" | base64 -d > ./sixlabors.lic
          cp ./sixlabors.lic ../sixlabors.lic

      - name: Cache SonarCloud packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Install SonarCloud scanner
        run: |
          dotnet tool install --global dotnet-sonarscanner

      - name: Build and analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"SSSKLv2_Backend" \
            /o:"ricardotill" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/*.opencover.xml" \
            /d:sonar.exclusions="Frontend/**,**/Migrations/**,**/Components/**,**/Controllers/**,**/Pages/**,**/DependencyInjection.cs,**/Program.cs" \
            /d:sonar.scanner.skipJreProvisioning=true

          dotnet build SSSKL.slnx

          dotnet test SSSKL.slnx --no-build --verbosity normal \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover

          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

  version:
    name: Version
    uses: ./.github/workflows/version.yml

  image:
    name: Docker image
    needs: [build, version]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Decode and save SixLabors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SixLaborsLicense }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "SixLaborsLicense secret is missing or empty"
            exit 1
          fi
          echo "$SIXLABORS_LICENSE" | base64 -d > "$RUNNER_TEMP/sixlabors.lic"

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch,enable={{is_default_branch}}
            type=sha,enable=${{ github.ref == 'refs/heads/master' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.version.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.title=SSSKL API

      # Only the few RUN steps of the final stage need emulation; the .NET build cross-compiles
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          file: Backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          # A pull request only checks that the image builds
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.version.outputs.version }}
          secret-files: sixlabors_lic=${{ runner.temp }}/sixlabors.lic
          cache-from: type=gha,scope=ssskl-api
          cache-to: type=gha,mode=max,scope=ssskl-api
          provenance: true
          sbom: true

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
